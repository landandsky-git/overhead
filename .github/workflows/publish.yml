# Publishes the app to GitHub Pages together with a fresh copy of the CelesTrak satellite lists.
# Phones then download the lists from this site instead of CelesTrak, which only allows each
# internet connection one download of a list every 2 hours.
# Runs on every push, every 4 hours, and on demand (Actions tab -> Run workflow).
# The automatic checks run first; the site is only published if they all pass.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Publish app and satellite data

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Checks the astronomy and data handling against reference values (tests/checks.js).
  # If any check fails, nothing is published.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the automatic checks
        run: node tests/run-node.js

  # Builds the site (app files plus fresh data) and uploads it for the deploy job below.
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Collect the app files
        run: |
          mkdir -p site/data
          cp index.html worker.js codes.js sky-data.js model3d.js sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png tle-fallback.txt site/
          cp -r lib js css models site/

      # CSV rather than the classic two-line text, which leaves out satellites numbered above 99999.
      - name: Download satellite lists (keep the last good copy if CelesTrak says no)
        run: |
          for g in active visual stations; do
            f="site/data/$g.csv"
            curl -sSL --retry 2 -A "Overhead satellite app (${{ github.repository }})" \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=csv" -o "$f" || true
            if head -c 200 "$f" 2>/dev/null | grep -q '^OBJECT_NAME,.*MEAN_MOTION'; then
              echo "$g: fresh from CelesTrak ($(wc -l < "$f") lines)"
            else
              echo "$g: CelesTrak gave no data, reusing the published copy"
              curl -sSL "${{ steps.pages.outputs.base_url }}/data/$g.csv" -o "$f" || true
              head -c 200 "$f" 2>/dev/null | grep -q '^OBJECT_NAME,.*MEAN_MOTION' || rm -f "$f"
            fi
          done
          date -u +"%Y-%m-%dT%H:%M:%SZ" > site/data/updated.txt

      # SpaceX's own Starlink orbits (CelesTrak's supplemental data) are fresher and more precise than
      # the public ones, especially for newly launched trains; they replace the public ones in the list.
      - name: Use SpaceX's own Starlink orbits
        run: |
          curl -sSL --retry 2 -A "Overhead satellite app (${{ github.repository }})" \
            "https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=csv" -o supgp.csv || true
          if [ -f site/data/active.csv ] && head -c 200 supgp.csv 2>/dev/null | grep -q '^OBJECT_NAME,.*MEAN_MOTION'; then
            python3 tools/merge-supgp.py site/data/active.csv supgp.csv
          else
            echo "No supplemental Starlink data this time; keeping the public orbits"
          fi

      # The brightest comets' orbits for the night-sky guide, from NASA JPL's Small-Body Database.
      - name: Fetch comet orbits (keep the last good copy if JPL says no)
        run: |
          if python3 tools/build-comets.py site/data/comets.json; then exit 0; fi
          echo "JPL gave no data, reusing the published copy"
          curl -sSL "${{ steps.pages.outputs.base_url }}/data/comets.json" -o site/data/comets.json || true
          grep -q '"comets"' site/data/comets.json 2>/dev/null || rm -f site/data/comets.json

      # Upcoming rocket launches and the people in space, for the Space tab, from The Space Devs'
      # Launch Library 2 (which allows only a few requests an hour, so phones don't ask it directly).
      - name: Fetch launches and crew (keep the last good copy if the library says no)
        run: |
          if python3 tools/build-space.py site/data/space.json; then exit 0; fi
          echo "Launch Library gave no data, reusing the published copy"
          curl -sSL "${{ steps.pages.outputs.base_url }}/data/space.json" -o site/data/space.json || true
          grep -q '"launches"' site/data/space.json 2>/dev/null || rm -f site/data/space.json

      # Typical brightness of each satellite, from Mike McCants' catalog and radar sizes.
      # Rebuilt once a day (and on every push); otherwise the published copy is reused.
      - name: Build brightness table
        shell: pwsh
        run: |
          $rebuild = "${{ github.event_name }}" -ne "schedule" -or (Get-Date).ToUniversalTime().Hour -lt 4
          if ($rebuild) {
            try {
              Invoke-WebRequest "https://www.mmccants.org/programs/qsmag.zip" -OutFile qsmag.zip
              Expand-Archive qsmag.zip -DestinationPath qsmag -Force
              Invoke-WebRequest "https://celestrak.org/pub/satcat.csv" -OutFile satcat.csv
              ./tools/build-mags.ps1 -QuicksatMag qsmag/quicksat.mag -Satcat satcat.csv `
                -OrbitFiles site/data/active.csv, site/data/visual.csv, site/data/stations.csv -Out site/data/mags.json
            } catch { Write-Host "Couldn't rebuild the brightness table: $_"; $rebuild = $false }
          }
          if (-not $rebuild) {
            try { Invoke-WebRequest "${{ steps.pages.outputs.base_url }}/data/mags.json" -OutFile site/data/mags.json }
            catch { Write-Host "No published brightness table yet; the app will use its built-in estimates" }
          }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishes the uploaded site. A job of its own (GitHub's usual layout for Pages): deploying in
  # the same job straight after the upload sometimes failed with "No artifacts named github-pages",
  # because GitHub hadn't finished registering the upload yet.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
